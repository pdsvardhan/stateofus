# Stage 2.4 prep — per-slot candidates from master_components (193 entries scanned 2026-06-12)
# NOT picks. Picking happens after the UI master plan locks, via the components-pick
# page (primary) or chat fallback. "author-fresh" slots get skip_reason at the gate
# and are built at Stage 3, then seeded back into the asset library.
# Summary: 30/48 slots have >=2 library candidates · 18 author-fresh (9 DV renderers,
# 5 interaction modes, 4 editor/composite primitives).

