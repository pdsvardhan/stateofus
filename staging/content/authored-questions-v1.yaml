# State of Us — Authored Question Draft v1 (2026-06-12)
# Author: Claude (per user mandate 2026-06-12: ">=100 questions covering a lot of
# categories, question styles"). 80 new questions below + 25 content-ready catalogue
# imports = 105 at launch.
# Status: DRAFT — user review + approval required before activation
#         (AC on feat-seed-content-pipeline).
# Standards applied (DOC 3): experience-first, 1-2 lines, single interaction,
# skip always allowed (global), visual payoff considered per question, no expertise
# required, bias-tolerant. Parked domains avoided: politics, work, deep beliefs.
# Modes: quick_pick / bucket_sort / tier_placement / tradeoff_cards / swipe_stack
# DVs: S1 split cards, S2 radial split, S3 liquid fill, G1 heat map, G2 bubble map,
#      R1 tier board, R2 leaderboard, R3 podium, P1 treemap (+ Insight Cards always)
# geo: true => question feeds G1/G2 + region insights (uses feat-region-capture)

meta:
  totals: { new: 80, imported_ready: 25, launch_total: 105 }
  per_category: { C1: 13, C2: 13, C3: 14, C4: 13, C5: 13, C6: 14 }
  per_mode: { quick_pick: 30, bucket_sort: 12, tier_placement: 13, tradeoff_cards: 12, swipe_stack: 13 }
  duplication_check: >
    Verified against the 25 content-ready catalogue rows. Near-neighbors flagged
    inline with `overlap_note` and differentiated by frame/cards.

