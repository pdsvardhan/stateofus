services:
  app:
    build: .
    container_name: stateofus
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8510:3000"
    networks:
      - projects-net
    volumes:
      - /mnt/storage/stateofus:/data
    environment:
      - DATABASE_FILE=/data/stateofus.db
      - TZ=Asia/Kolkata
      - NODE_ENV=production
      # device identity (non-negotiable #7) — value in server-side .env only
      - DEVICE_HASH_SALT=${DEVICE_HASH_SALT}
      # app-level admin gate (defense in depth under Authentik forward-auth, adr-006)
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      # Ottomate /design route — container-to-container on projects-net
      - OTTOMATE_PROJECT_SLUG=stateofus
      - TRACKER_API_BASE=http://ottomate:3000
      - TRACKER_API_TOKEN=${TRACKER_API_TOKEN}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  projects-net:
    external: true
